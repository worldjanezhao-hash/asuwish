<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>心愿每日监测</title><style>body{max-width:850px;margin:40px auto;padding:24px;font:16px system-ui;background:#f7f6f2;color:#243a35}section,article{background:white;padding:24px;border-radius:16px;margin:20px 0}input,button{padding:10px;margin:8px 5px}input[type=url]{width:65%}button{cursor:pointer}#message{white-space:pre-wrap}small{color:#59665f}a{color:#246c59}</style><p><a href="home.html">我的心愿首页</a></p><h1>心愿每日监测</h1><p>添加商品链接，每天查看价格变化。</p><section><form id="settings"><label>每日检查时间 <input id="time" type="time" value="18:00" required></label><label><input id="enabled" type="checkbox" checked>启用每日检查</label><button>保存设置</button></form><small>使用电脑本地时间。检查会打开临时后台标签页，完成后关闭。浏览器关闭或电脑休眠时无法检查，恢复后补查当天任务。登录或验证需要你在闲鱼页面完成。</small></section><section><form id="add"><input id="url" type="url" required placeholder="粘贴闲鱼商品链接"><input id="target" type="number" min="0" step="0.01" placeholder="目标价（选填）"><button>添加商品</button></form><button id="run">立即检查全部商品</button><button id="export">导出全部记录</button><p id="message" role="status"></p></section><div id="items"></div><script src="monitor.js"></script></html>
