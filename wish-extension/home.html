<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>心愿养成所</title><link rel="stylesheet" href="home.css"><header><strong>心愿养成所</strong><a href="monitor.html">商品价格监测</a></header><main><p class="eyebrow">一点点，靠近想要的生活</p><h1 id="heading">把心愿，慢慢攒成日常。</h1><div id="message" role="status"></div><section id="setup"><h2>你的第一个心愿</h2><form id="wish-form"><label>想要什么<input id="name" placeholder="例如：一台陪我旅行的 CCD" required maxlength="100"></label><label>目标金额（元）<input id="goal" type="number" min="0.01" step="0.01" required></label><label>已经攒了（元）<input id="initial" type="number" min="0" step="0.01" value="0" required></label><label>每周计划攒（元）<input id="weekly" type="number" min="0.01" step="0.01" required></label><button>开始养成心愿</button></form></section><div id="dashboard" hidden><div class="columns"><section class="scene"><div class="sky"><span class="sun"></span><div class="mountain back"></div><div class="mountain"></div><div id="camera" aria-hidden="true"><div class="lens"></div><span>WISH</span></div><div class="flowers" id="flowers" aria-hidden="true">✿　✿　✿　✿　✿</div></div><p id="stage"></p><small>风景随储蓄进度展开</small></section><section><p class="eyebrow">离心愿又近了一点</p><h2 id="saved"></h2><p id="remaining"></p><progress id="progress" max="100" value="0" aria-label="储蓄完成进度"></progress><p id="estimate"></p><form id="entry-form"><label>这次的金额（元）<input id="amount" type="number" min="0.01" step="0.01" required></label><label>记录类型<select id="kind"><option value="deposit">存入</option><option value="withdrawal">取出</option></select></label><label>给这一天留句话<input id="note" maxlength="150" placeholder="今天少点了一杯奶茶"></label><button>记下一笔</button></form><small>记录你自己保管的钱，金额由你确认。</small></section></div><section><h2>心愿候选商品</h2><p>选择与你的心愿对应的商品，查看真实记录。</p><select id="product"><option value="">选择已添加的监测商品</option></select><p id="price-summary"></p><svg id="chart" viewBox="0 0 720 200" role="img" aria-label="已记录挂牌价格变化"></svg><p id="advice"></p><a id="product-link" hidden target="_blank" rel="noopener">打开商品确认</a><p><a href="monitor.html">添加商品或检查最新价格</a></p></section><section><h2>攒钱足迹</h2><ul id="ledger"></ul><button id="backup" class="secondary">备份全部心愿数据</button></section></div></main><script src="home.js"></script></html>
