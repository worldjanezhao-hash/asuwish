<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>心愿价格记录</title><style>body{width:360px;padding:18px;font:14px system-ui;background:#f7f6f2;color:#243a35}h1{font-size:21px}label{display:block;margin:12px 0}input,select{box-sizing:border-box;width:100%;padding:9px;margin-top:5px}button{padding:10px;margin:4px;border:0;border-radius:6px;background:#246c59;color:white;cursor:pointer}small{color:#59665f}#message{white-space:pre-wrap}li{margin:9px 0}</style><h1>心愿价格记录</h1><button id="home">我的心愿首页</button><button id="monitor">每日监测设置</button><p>打开商品详情页，读取后核对再保存。</p><button id="read">读取当前商品</button><p id="message" role="status"></p><form id="form" hidden><label>商品标题<input id="title" required maxlength="500"></label><label>当前挂牌价（元）<input id="price" type="number" min="0.01" step="0.01" required></label><label>成色描述<input id="condition" maxlength="500"></label><label>商品状态<select id="status"><option value="unknown">未确认</option><option value="available">在售（人工确认）</option><option value="sold">已售出（人工确认）</option><option value="removed">已下架（人工确认）</option></select></label><small>页面解析是候选结果，请核对价格是否为售价。读取失败不代表下架。</small><p><button type="submit">确认保存快照</button></p></form><button id="export">导出记录 JSON</button><h3>当前商品历史</h3><ul id="history"></ul><script src="parser.js"></script><script src="popup.js"></script></html>
